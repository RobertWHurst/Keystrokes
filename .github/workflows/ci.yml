name: Lint & Test

on:
  push:
    branches: master
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Check Linting and Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Linter
        run: pnpm lint

      - name: Build Source
        run: pnpm build

      - name: Run Tests
        run: pnpm test
